<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Adam</title>
  <link rel="stylesheet" href="Looks.css">
</head>
<body>

  <!-- Minimalist Back Button -->
  <a href="index.html" class="back-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    Back
  </a>

  <!-- Main Grid Wrapper Layout -->
  <div class="page-wrapper">
    
    <!-- Left Side Photos -->
    <div class="photo-column">
      <img src="images (1).jpg" alt="A photo of a blackhole">
      <img src="1.jpg" alt="This is a photo of a black hole">
    </div>

    <!-- Centered Form Container -->
    <div class="contact-container">
      <h2>Contact Me With Any Questions</h2>
      
      <!-- Fixed form with added configuration inputs -->
     <form class="contact-form" action="https://formsubmit.co/spaghettified123@gmail.com" method="POST">

       <!-- Hidden FormSubmit Configuration Fields -->
       <input type="hidden" name="_next" value="https://adamnotcool.github.io/My-First-Website-CATA-Project/">
       <input type="hidden" name="_url" value="https://adamnotcool.github.io/My-First-Website-CATA-Project/">
       <input type="hidden" name="_subject" value="New message from your website contact form!">
       <input type="hidden" name="_template" value="table">
  
       <div class="input-group">
         <!-- Name and Email fields structured side-by-side -->
         <input type="text" name="name" placeholder="Your Name" required>
         <input type="email" name="email" placeholder="Your Email" required>
       </div>
      
       <!-- Main message block -->
       <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
      
       <!-- Submit button -->
       <button type="submit">Send</button>

     </form>
    </div>

    <!-- Right Side Photos -->
    <div class="photo-column">
      <img src="images (2).jpg" alt="This is a photo of a black hole">
      <img src="images.jpg" alt="This is a photo of a black hole">
    </div>

  </div>

</body>
</html>
